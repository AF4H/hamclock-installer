name: Validate installer profile
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debconf shellcheck
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck scripts/*.sh
      - run: python3 -m py_compile scripts/build.py scripts/build-usb.py
