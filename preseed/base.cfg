#_preseed_V1
# Boot with auto=true priority=high; never use priority=critical.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/get_hostname string hamclock-install
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string HamClock
d-i passwd/username string hamclock
d-i passwd/user-password password h@mradio
d-i passwd/user-password-again password h@mradio
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true
# Deliberately leave ALL partman and bootloader disk choices unseeded.
# Debian's normal disk-selection and destructive confirmation UI is mandatory.
tasksel tasksel/first multiselect standard, ssh-server, xfce-desktop
d-i pkgsel/include string sudo openssh-server xfce4 lightdm lightdm-gtk-greeter
d-i pkgsel/upgrade select none
lightdm shared/default-x-display-manager select lightdm
popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note
