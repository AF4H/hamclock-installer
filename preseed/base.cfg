#_preseed_V1
# One explicit disk-erasing confirmation, then automatic installation.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/wireless_show_essids select manual
d-i netcfg/wireless_essid string AF4H
d-i netcfg/wireless_essid_again string AF4H
d-i netcfg/wireless_security_type select wpa
d-i netcfg/wireless_wpa password h@mradio
d-i netcfg/wireless_wep string
d-i anna/choose_modules string network-console
d-i network-console/password password h@mradio
d-i network-console/password-again password h@mradio
d-i network-console/start note
d-i hw-detect/load_firmware boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true
d-i netcfg/get_hostname string hamclock-install
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string HamClock
d-i passwd/username string hamclock
d-i passwd/user-password password h@mradio
d-i passwd/user-password-again password h@mradio
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true
# installer-disk.sh supplies the selected disk only after explicit consent.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select hamclock
d-i partman-partitioning/default_label string gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i base-installer/install-recommends boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server xfce4 xserver-xorg dbus-x11 fonts-dejavu-core lightdm lightdm-gtk-greeter curl ca-certificates python3 x11-xserver-utils libglib2.0-bin plymouth plymouth-themes polkitd
d-i pkgsel/upgrade select none
lightdm shared/default-x-display-manager select lightdm
popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note
